name: DSE Daily Pipeline

on:
  schedule:
    # 3:00 PM UTC = 6:00 PM EAT, Monday–Friday
    - cron: '0 15 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dse-pipeline
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package
        run: pip install -e .

      - name: Write email config from secrets
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          jq -n --arg addr "$GMAIL_ADDRESS" --arg pw "$GMAIL_APP_PASSWORD" \
            '{gmail_address: $addr, app_password: $pw, enabled: true}' > email_config.json

      - name: Run pipeline
        run: dse-pipeline

      - name: Commit updated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dse_equity_daily.csv
          git diff --cached --quiet || git commit -m "Daily equity data update [skip ci]"
          git push

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          path: |
            logs/
            reports/
          retention-days: 7
