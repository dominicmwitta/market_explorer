[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dse-explorer"
version = "1.0.0"
description = "Scraper and analytics for the Dar es Salaam Stock Exchange"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "playwright>=1.40.0",
    "pdfplumber>=0.9.0",
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "streamlit>=1.28.0",
    "plotly>=5.15.0",
    "openpyxl>=3.1.0",
    "pillow>=10.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
include = ["dse_explorer*"]
namespaces = false

[tool.setuptools.package-data]
dse_explorer = [
    "pwa_assets/*.html",
    "pwa_assets/*.json",
    "pwa_assets/*.js",
    "pwa_assets/icons/*.png",
]

[project.scripts]
dse-scrape = "dse_explorer.main:main"
dse-equity-scrape = "dse_explorer.equity_scraper:main"
dse-pipeline = "dse_explorer.pipeline:main"
dse-pdf-download = "dse_explorer.pdf_download:main"
dse-pdf-extract = "dse_explorer.pdf_extract:main"
dse-analyze = "dse_explorer.analyzer:main"
dse-dashboard = "dse_explorer.dashboard:cli"
dse-create-shortcuts = "dse_explorer.shortcuts:main"
dse-watchlist = "dse_explorer.watchlist:main"
dse-alerts = "dse_explorer.alerts:main"
dse-backfill = "dse_explorer.backfill:main"
dse-schedule = "dse_explorer.scheduler:main"
dse-backtest = "dse_explorer.backtest:main"
dse-notify = "dse_explorer.notifier:main"
dse-pwa-server = "dse_explorer.pwa_server:main"
dse-db-migrate = "dse_explorer.db_migrate:main"
